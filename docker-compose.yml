  services:

    launcher:
      build: ./launcher
      ports:
        - "8080:80"
      volumes:
        - ./launcher:/var/www/html
      
    core_php:
      build: ./core-php
      ports:
        - "8000:80"
      volumes:
        - ./core-php:/var/www/html
        - ./shared/js:/var/www/html/shared/js
      depends_on:
        - student_db
        - auth_db

    student_db:
      image: mysql:8
      container_name: student_db
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: student_db
      ports:
        - "3307:3306"
      volumes:
        - student_data:/var/lib/mysql
        - ./core-php/db/studentdb_init.sql:/docker-entrypoint-initdb.d/student_init.sql


    auth_db:
      image: mysql:8
      container_name: auth_db
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: auth_db
      ports:
        - "3308:3306"
      volumes:
        - auth_data:/var/lib/mysql
        - ./core-php/db/authdb_init.sql:/docker-entrypoint-initdb.d/auth_init.sql


    laravel:
      build: ./student-management-laravel
      ports:
        - "8001:8000"
      volumes:
        - ./student-management-laravel:/var/www
        - ./shared/js:/var/www/public/shared/js
      depends_on:
        - student_db
        - auth_db
      # networks:
      #   - student-network

  volumes:
    student_data:
    auth_data:

  # networks:
  #   student-network:
  #     external: true
  #     name: core-php_default